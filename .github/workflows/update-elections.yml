name: Refresh official election results
on:
  schedule:
    - cron: '43 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-election-results
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect_official_results.py
      - name: Preserve observed source snapshot and health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/publication/official-results.json data/discovery/election-runs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh official source observations'
          git pull --rebase origin main
          git push origin HEAD:main
