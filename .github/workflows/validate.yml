name: Validate research platform
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit to validate for publication'
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: worldwar-test-only
          POSTGRES_DB: worldwar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci && npm --prefix web ci
      - run: npm test
      - name: PostgreSQL integration
        run: PYTHONPATH=backend python backend/tests/postgres_smoke.py --disposable-test-database
        env:
          WORLDWAR_DATABASE_URL: postgresql+psycopg://postgres:worldwar-test-only@127.0.0.1:5432/worldwar_test
      - run: npm run build
        env:
          VITE_BASE_PATH: /WorldWar/
      - run: npm run check:public
      - uses: actions/upload-artifact@v4
        with:
          name: verified-public-build
          path: web/dist
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORLDWAR_DATABASE_PASSWORD: disposable-ci-database-password
      WORLDWAR_EDITOR_TOKEN: disposable-ci-editor-token
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300 -d
      - name: Verify same-origin public API and protected editor
        run: python3 scripts/check_deployment.py --base http://127.0.0.1:8080 --disposable-test-database
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes
